<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon Study</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#000000">
</head>
<body class="flex items-center justify-center h-[100dvh] overflow-hidden" style="padding-bottom: env(safe-area-inset-bottom);">
    <div class="stars" id="stars"></div>
    <div class="noise"></div>
    
    <div class="relative z-10 flex flex-col items-center gap-3 sm:gap-4 w-full max-w-2xl px-4">
        
        <!-- Moon Section -->
        <div class="flex justify-center items-center mb-4 sm:mb-8">
            <img id="moon" src="/static/moon/new.jpg" class="moon-img">
        </div>
        
        <!-- Timer -->
        <div id="timer" class="text-center">00:00</div>
            
        <div id="overtimeDisplay" class="text-gray-500 text-sm font-light mt-1 sm:mt-2 h-5"></div>
        
        <!-- Duration Selector -->
        <div class="mt-3 sm:mt-4">
            <select id="durationSelect" class="bg-transparent border border-gray-700 text-gray-300 text-sm rounded-full px-4 py-2 focus:outline-none focus:border-gray-500">
                <option value="10">10 min</option>
                <option value="15">15 min</option>
                <option value="20">20 min</option>
                <option value="25" selected>25 min</option>
                <option value="30">30 min</option>
                <option value="35">35 min</option>
                <option value="40">40 min</option>
                <option value="45">45 min</option>
                <option value="50">50 min</option>
                <option value="55">55 min</option>
                <option value="60">60 min</option>
            </select>
        </div>
        
        <!-- Controls -->
        <div class="flex gap-2 sm:gap-3">
            <button class="btn btn-primary" id="startBtn">Start</button>
            <button class="btn" id="pauseBtn">Pause</button>
            <button class="btn" id="resetBtn">Reset</button>
            <button class="btn" id="doneBtn">Done</button>
        </div>
        
        <div class="flex gap-3 text-xs">
            <a href="/weekly" class="text-gray-500 hover:text-gray-300 transition-colors">Weekly</a>
        </div>
        
        <!-- Stats Section -->
        <div class="w-full max-w-xs sm:max-w-sm">
            <div class="text-center mb-2">
                <span class="text-white text-lg font-light" id="totalTime">0h 0m</span>
                <p class="text-gray-500 text-xs mt-0.5 uppercase tracking-widest">Today</p>
            </div>
            
            <div class="divider my-3"></div>
            
            <div id="sessionList" class="space-y-2 text-center min-h-[60px]">
                <p class="text-gray-600 text-xs">No sessions yet</p>
            </div>
        </div>
        
    </div>

    <script src="/static/js/timer.js"></script>
</body>
</html>
